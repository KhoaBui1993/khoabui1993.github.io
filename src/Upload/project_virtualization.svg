<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgVirt)"/>

  <!-- Cluster Nodes -->
  <g transform="translate(60, 45)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="80" height="70" rx="8" fill="url(#nodeGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="40" y="24" font-family="sans-serif" font-size="11" fill="#f97316" font-weight="bold" text-anchor="middle">Proxmox</text>
    <text x="40" y="40" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Node 01</text>
    <rect x="15" y="50" width="50" height="8" rx="4" fill="#15803d"/>

    <!-- Node 2 -->
    <rect x="100" y="0" width="80" height="70" rx="8" fill="url(#nodeGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="140" y="24" font-family="sans-serif" font-size="11" fill="#f97316" font-weight="bold" text-anchor="middle">Proxmox</text>
    <text x="140" y="40" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Node 02</text>
    <rect x="115" y="50" width="50" height="8" rx="4" fill="#15803d"/>

    <!-- Node 3 -->
    <rect x="200" y="0" width="80" height="70" rx="8" fill="url(#nodeGrad)" stroke="#4b5563" stroke-width="1.5"/>
    <text x="240" y="24" font-family="sans-serif" font-size="11" fill="#f97316" font-weight="bold" text-anchor="middle">Proxmox</text>
    <text x="240" y="40" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Node 03</text>
    <rect x="215" y="50" width="50" height="8" rx="4" fill="#15803d"/>

    <!-- Connecting Bus -->
    <line x1="40" y1="70" x2="40" y2="90" stroke="#f97316" stroke-width="2"/>
    <line x1="140" y1="70" x2="140" y2="90" stroke="#f97316" stroke-width="2"/>
    <line x1="240" y1="70" x2="240" y2="90" stroke="#f97316" stroke-width="2"/>
    <line x1="40" y1="90" x2="240" y2="90" stroke="#f97316" stroke-width="2"/>

    <!-- Storage Pool -->
    <rect x="50" y="100" width="180" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="120" font-family="sans-serif" font-size="10" fill="#93c5fd" font-weight="600" text-anchor="middle">RAID 10 Storage Pool (PERC / NVMe)</text>
  </g>

  <text x="200" y="200" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">High-Availability Virtualization & Storage Cluster</text>
</svg>
