<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgServer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgServer)"/>

  <!-- Rack outline -->
  <rect x="110" y="25" width="180" height="150" rx="8" fill="none" stroke="#3f3f46" stroke-width="2"/>

  <!-- Server Blades (1U / 2U) -->
  <g transform="translate(120, 35)">
    <!-- Server 1 -->
    <rect x="0" y="0" width="160" height="24" rx="4" fill="url(#serverGrad)" stroke="#52525b" stroke-width="1"/>
    <circle cx="12" cy="12" r="3" fill="#22c55e"/>
    <circle cx="22" cy="12" r="3" fill="#22c55e"/>
    <circle cx="32" cy="12" r="3" fill="#eab308"/>
    <rect x="50" y="7" width="90" height="10" rx="2" fill="#27272a"/>
    <text x="145" y="16" font-family="monospace" font-size="9" fill="#a1a1aa">RHEL</text>

    <!-- Server 2 -->
    <rect x="0" y="32" width="160" height="24" rx="4" fill="url(#serverGrad)" stroke="#52525b" stroke-width="1"/>
    <circle cx="12" cy="44" r="3" fill="#22c55e"/>
    <circle cx="22" cy="44" r="3" fill="#22c55e"/>
    <circle cx="32" cy="44" r="3" fill="#22c55e"/>
    <rect x="50" y="39" width="90" height="10" rx="2" fill="#27272a"/>
    <text x="145" y="48" font-family="monospace" font-size="9" fill="#a1a1aa">PXE</text>

    <!-- Server 3 -->
    <rect x="0" y="64" width="160" height="24" rx="4" fill="url(#serverGrad)" stroke="#52525b" stroke-width="1"/>
    <circle cx="12" cy="76" r="3" fill="#22c55e"/>
    <circle cx="22" cy="76" r="3" fill="#22c55e"/>
    <circle cx="32" cy="76" r="3" fill="#3b82f6"/>
    <rect x="50" y="71" width="90" height="10" rx="2" fill="#27272a"/>
    <text x="145" y="80" font-family="monospace" font-size="9" fill="#a1a1aa">iLO</text>

    <!-- Server 4 -->
    <rect x="0" y="96" width="160" height="24" rx="4" fill="url(#serverGrad)" stroke="#52525b" stroke-width="1"/>
    <circle cx="12" cy="108" r="3" fill="#22c55e"/>
    <circle cx="22" cy="108" r="3" fill="#eab308"/>
    <circle cx="32" cy="108" r="3" fill="#22c55e"/>
    <rect x="50" y="103" width="90" height="10" rx="2" fill="#27272a"/>
    <text x="140" y="112" font-family="monospace" font-size="9" fill="#a1a1aa">iDRAC</text>
  </g>

  <!-- Network / Ansible connection lines -->
  <path d="M 50 100 Q 80 100 110 50" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 350 100 Q 320 100 290 145" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>

  <rect x="20" y="88" width="60" height="24" rx="6" fill="#312e81"/>
  <text x="50" y="104" font-family="sans-serif" font-size="10" fill="#c7d2fe" font-weight="600" text-anchor="middle">Ansible</text>

  <rect x="320" y="88" width="60" height="24" rx="6" fill="#064e3b"/>
  <text x="350" y="104" font-family="sans-serif" font-size="10" fill="#a7f3d0" font-weight="600" text-anchor="middle">Telemetry</text>

  <text x="200" y="200" font-family="sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">Bare-Metal PXE & Server Fleet Automation</text>
</svg>
