<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgRTL)"/>
  
  <!-- Circuit grid pattern -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4">
    <line x1="40" y1="20" x2="40" y2="200" />
    <line x1="360" y1="20" x2="360" y2="200" />
    <line x1="20" y1="40" x2="380" y2="40" />
    <line x1="20" y1="180" x2="380" y2="180" />
  </g>

  <!-- Central Chip representation -->
  <rect x="150" y="60" width="100" height="100" rx="12" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3"/>
  <rect x="170" y="80" width="60" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">RTL</text>

  <!-- Pins -->
  <g stroke="#38bdf8" stroke-width="2.5">
    <line x1="165" y1="45" x2="165" y2="60" />
    <line x1="185" y1="45" x2="185" y2="60" />
    <line x1="215" y1="45" x2="215" y2="60" />
    <line x1="235" y1="45" x2="235" y2="60" />

    <line x1="165" y1="160" x2="165" y2="175" />
    <line x1="185" y1="160" x2="185" y2="175" />
    <line x1="215" y1="160" x2="215" y2="175" />
    <line x1="235" y1="160" x2="235" y2="175" />

    <line x1="135" y1="75" x2="150" y2="75" />
    <line x1="135" y1="95" x2="150" y2="95" />
    <line x1="135" y1="125" x2="150" y2="125" />
    <line x1="135" y1="145" x2="150" y2="145" />

    <line x1="250" y1="75" x2="265" y2="75" />
    <line x1="250" y1="95" x2="265" y2="95" />
    <line x1="250" y1="125" x2="265" y2="125" />
    <line x1="250" y1="145" x2="265" y2="145" />
  </g>

  <!-- Status badges -->
  <rect x="50" y="165" width="85" height="24" rx="12" fill="#14532d" />
  <text x="92" y="181" font-family="sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">PASS: 100%</text>

  <rect x="270" y="165" width="80" height="24" rx="12" fill="#1e1b4b" />
  <text x="310" y="181" font-family="sans-serif" font-size="11" fill="#a5b4fc" font-weight="600" text-anchor="middle">HIL Validated</text>

  <text x="200" y="205" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Automated Regression Pipeline</text>
</svg>
